<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ product.name }} | Computer Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#111111",
              paper: "#f8f9fa",
              accent: "#d7263d",
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Prompt", sans-serif;
      }
    </style>
  </head>
  <body class="bg-paper text-ink">
    <nav class="border-b border-gray-200 bg-white/80 backdrop-blur">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"
      >
        <a href="{% url 'home' %}" class="text-lg font-semibold tracking-wide"
          >Computer Store</a
        >
        <a
          href="{% url 'all-products' %}"
          class="rounded-full bg-ink px-4 py-2 text-sm font-medium text-white"
          >กลับไปหน้ารายการ</a
        >
      </div>
    </nav>

    <main class="mx-auto max-w-6xl px-6 py-12">
      <div
        class="rounded-3xl border border-gray-200 bg-white p-8 shadow-sm sm:p-10"
      >
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div>
            <p
              class="text-sm font-semibold uppercase tracking-[0.25em] text-accent"
            >
              รายละเอียดสินค้า
            </p>
            <h1 class="mt-2 text-3xl font-bold">{{ product.name }}</h1>
          </div>
          <div class="rounded-2xl bg-red-50 px-4 py-3 text-right">
            <p class="text-xs uppercase tracking-[0.2em] text-gray-500">ราคา</p>
            <p class="text-2xl font-semibold text-accent">
              {{ product.price|floatformat:0 }} บาท
            </p>
          </div>
        </div>

        <div class="mt-8 grid gap-8 lg:grid-cols-[1.2fr_0.8fr]">
          <div>
            <h2 class="text-lg font-semibold">ข้อมูลสินค้า</h2>
            <p class="mt-3 text-sm leading-7 text-gray-600">
              {{ product.description }}
            </p>
          </div>
          <div class="rounded-2xl bg-gray-50 p-6">
            <p
              class="text-sm font-semibold uppercase tracking-[0.2em] text-gray-500"
            >
              หมวดหมู่
            </p>
            <p class="mt-2 text-lg font-semibold">
              {{ product.category.name }}
            </p>
            <p
              class="mt-5 text-sm font-semibold uppercase tracking-[0.2em] text-gray-500"
            >
              แบรนด์
            </p>
            <p class="mt-2 text-lg font-semibold">{{ product.brand.name }}</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
