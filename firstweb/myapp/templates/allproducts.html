<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test All Products (Static)</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Prompt", sans-serif;
        background-color: #f8f9fa;
        padding: 40px 20px;
      }
      .card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        transition: all 0.3s ease;
        margin-bottom: 30px;
        overflow: hidden;
      }
      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      }
      .card-img-top {
        height: 250px;
        object-fit: cover;
      }
      h1 {
        font-weight: 700;
        margin-bottom: 40px;
        color: #2c3e50;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center">🛒 รายการสินค้าทั้งหมด</h1>
      <div class="row mt-4">
        {% for p in products %}
        <!-- Card 1 -->
        <div class="col-md-4">
          <div class="card">
            {% if p.image %}
            <img
              src="{{ p.image.url }}"
              class="card-img-top"
              alt="{{ p.title }}"
            />
            {% else %}
            <img
              src="https://placehold.co/400x300?text=No+Image"
              class="card-img-top"
              alt="{{ p.title }}"
            />
            {% endif %}
            <div class="card-body text-center p-4">
              <h4 class="card-title fw-bold mb-3">{{ p.title }}</h4>
              <p class="card-text text-muted mb-4">{{ p.detail }}</p>
              {% if p.others %}
              <p class="mb-0 text-secondary">
                <small><i class="bi bi-info-circle"></i> {{ p.others }}</small>
              </p>
              {% endif %}
              <a
                href="#"
                class="btn btn-primary w-100 mt-3 rounded-pill"
                style="
                  background: linear-gradient(135deg, #667eea, #764ba2);
                  border: none;
                "
                >ดูรายละเอียด</a
              >
            </div>
          </div>
        </div>
        {% empty %}
        <p>ไม่พบสินค้า</p>
        {% endfor %}
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
